<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DC Heroes — Añadí tu super | Programación II</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;700&family=Karla&family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/formularios.css" />
  </head>
  <body>
    
    <div class="page-shell">
      <div class="top-bar">Descuentos 20%</div>

      <header class="brand-header">
        <p class="brand-title">DC Heroes</p>
      </header>

      <nav class="main-nav" aria-label="Principal">
        <a href="#">Contacto</a>
        <a href="#">Registrarme</a>
        <a href="#">Ingresar</a>
      </nav>

      <main class="page-main">

        <form class="formulario">
          <h2>Añadí tu super!</h2>
          <p class="subtitulo">Agregá tu personaje favorito completando las opciones.</p>

          <div class="principal">
             <div class="col-izq">
                <p>*Nombre</p>
                <input type="text" placeholder="Nombre" required>
                <p>Fecha</p>
                <input type="date">
                <textarea placeholder="Descripción"></textarea>
             </div>

           <div class="col-der">
               <p>*Especie</p>
               <select required>
                  <option>Especie</option>
                  <option>Desconocido</option>
               </select>
               <p>Agregar Foto</p>

               <input type="file">

              <div class="poderes">
                 <p>Poderes</p>
                 <label><input type="checkbox"> Volar</label>
                 <label><input type="checkbox"> SuperInteligencia</label>
                 <label><input type="checkbox"> Vista de rayo láser</label>
                 <label><input type="checkbox"> Billetera gorda</label>
              </div>

              <div class="linea"></div>
                 <div class="tipo">
                   <p>Tipo de Personaje</p>
                   <label><input type="radio" name="tipo"> Héroe / Heroina</label>
                   <label><input type="radio" name="tipo"> Villano / Villana</label>
                 </div>
              </div>
            </div>
           <button type="submit">Añadir</button>

        </form>

      </main>

      <footer class="site-footer">
        <p>Todos los derechos reservados - [ELINA LUISANA COPA]</p>
        <img class="github" src="img/Github Icon.png" alt="GitHub">
      </footer>
    </div>
  </body>
</html>
